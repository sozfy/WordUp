            <div class="modal-body">
                <p class="tip">输入名称创建空词表，或从下方预设词表选择</p>
                <input type="text" id="newListName" placeholder="词表名称（创建空词表）" style="width:100%;margin-bottom:10px;">
                <div style="display: flex; gap: 8px; width: 100%;margin-bottom:12px;">
                    <button onclick="createList()">创建空词表</button>
                </div>
                <div class="tip" style="border-top:1px solid #5a5c66;padding-top:10px;">预设词表（基于词典 tag 生成）</div>
                <div id="presetListOptions" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
                    <span style="color:#909399;font-size:0.85rem;">加载中...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加单词弹窗 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <span>添加单词 — <span id="addModalListName">当前词表</span></span>
                <button class="modal-close" onclick="closeModal('addModal')"><svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M2.59 2.72l.06-.07a.5.5 0 01.63-.06l.07.06L8 7.29l4.65-4.64a.5.5 0 01.7.7L8.71 8l4.64 4.65c.18.17.2.44.06.63l-.06.07a.5.5 0 01-.63.06l-.07-.06L8 8.71l-4.65 4.64a.5.5 0 01-.7-.7L7.29 8 2.65 3.35a.5.5 0 01-.06-.63l.06-.07-.06.07z"></path></svg></button>
            </div>
            <div class="modal-body">
                <p class="tip">每行输入一个英文单词，释义自动从本地词典获取</p>
                <textarea id="wordInput" placeholder="例如：apple&#10;banana&#10;book"></textarea>
                <div style="display: flex; gap: 8px; width: 100%;">
                    <button onclick="addWords()">添加单词</button>
                    <button class="danger" onclick="clearAllWords()">清空当前词表</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 单词列表弹窗 -->
    <div class="modal-overlay" id="listModal">
        <div class="modal">
            <div class="modal-header">
                <span>单词列表 — <span id="listModalName">当前词表</span></span>
                <button class="modal-close" onclick="closeModal('listModal')"><svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M2.59 2.72l.06-.07a.5.5 0 01.63-.06l.07.06L8 7.29l4.65-4.64a.5.5 0 01.7.7L8.71 8l4.64 4.65c.18.17.2.44.06.63l-.06.07a.5.5 0 01-.63.06l-.07-.06L8 8.71l-4.65 4.64a.5.5 0 01-.7-.7L7.29 8 2.65 3.35a.5.5 0 01-.06-.63l.06-.07-.06.07z"></path></svg></button>
            </div>
            <div class="modal-body">
                <div class="word-count" id="wordCount">单词总数：0</div>
                <div class="split-row">
                    <input type="number" id="splitCount" min="1" step="1" placeholder="数量" title="输入要拆分的单词个数">
                    <button id="splitBtn" onclick="splitWords()">拆分X个词</button>
                </div>
                <div class="merge-row">
                    <select id="mergeSelect" title="选择要合并的词表（合并后该词表会被删除）"></select>
                    <button id="mergeBtn" onclick="mergeList()">合并</button>
                </div>
                <div class="word-list" id="wordListDisplay">暂无单词</div>
            </div>
        </div>
    </div>

    <!--中心-->
    <main class="main-content">
        <div class="container">
            <h1>随机抽词</h1>

            <!-- 随机抽词区域 -->
            <div class="section">
                <div class="active-list-name" id="activeListName">当前词表</div>
                <div class="remain-count" id="remainCount">待抽取个数：0</div>

                <div class="word-display">
                    <div class="word-last" id="lastWord">上一个单词</div>
                    <div class="word" id="currentWord">点击开始抽取单词</div>
                    <div class="meaning hidden" id="currentMeaning"></div>
                </div>

                <div id="optionDiv">
                    <button class="options" id="optionButton1" onclick="isOptionCorrect(1)">选项1</button>
                    <button class="options" id="optionButton2" onclick="isOptionCorrect(2)">选项2</button>
                    <button class="options" id="optionButton3" onclick="isOptionCorrect(3)">选项3</button>
                    <button class="options" id="optionButton4" onclick="isOptionCorrect(4)">选项4</button>
                </div>

                <div style="display: flex; gap: 1%;">
                    <button class="check1" onclick="drawWord(1)" id="checkButton1" disabled>认识</button>
                    <button class="check2" onclick="drawWord(0)" id="checkButton2" disabled>不认识</button>
                </div>

                <div style="display: flex; gap: 1%; margin-top:0.5rem;">
                    <button onclick="startDraw()" id="startButton">开始抽取</button>
                    <button onclick="toggleMeaning()" id="showButton">显示意思</button>
                </div>

                <button style="width: 100%; margin-top:0.5rem;" class="danger" onclick="resetDraw()">重置抽取</button>
            </div>
        </div>
    </main>

    <script src="js/common.js?v=2"></script>
    <script src="data/preset_data.js?v=2"></script>
    <script src="js/script.js?v=3"></script>

    <!-- 自定义提示框 -->
    <div id="appToast"></div>
    <!-- 自定义对话框（确认 / 输入） -->
    <div class="app-dialog-overlay" id="appDialogOverlay" style="display:none;">
        <div class="app-dialog">
            <div class="app-dialog-title" id="appDialogTitle">提示</div>
            <div class="app-dialog-msg" id="appDialogMsg"></div>
            <input type="text" id="appDialogInput" style="display:none;" placeholder="请输入" />
            <div class="app-dialog-btns">
                <button type="button" class="app-dialog-btn cancel" onclick="dialogCancel()">取消</button>
                <button type="button" class="app-dialog-btn ok" onclick="dialogOk()">确定</button>
            </div>
        </div>
    </div>
</body>

</html>
