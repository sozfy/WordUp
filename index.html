            <div class="section" style="max-width:600px;">
                <h3>使用说明</h3>
                <p style="font-size:0.9rem;color:#c0c4cc;line-height:1.8;">
                    1. <strong>背单词</strong>：批量导入单词后随机抽背，支持选择题模式，认识/不认识分类记忆，数据保存在本地浏览器。<br>
                    2. <strong>查单词</strong>：导入 ECDICT 词典数据（ecdict.csv），即可离线查询单词释义、音标、词性等信息。<br>
                    3. 所有数据均存储在本地，无需联网，隐私安全。
                </p>
